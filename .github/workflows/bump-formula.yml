name: bump-formula

on:
  workflow_dispatch:
    inputs:
      formula:
        description: Formula basename without .rb (e.g. bmx, timely-cli)
        required: true
        type: string
      tag:
        description: Git tag including v prefix (e.g. v0.1.3)
        required: true
        type: string
      repository:
        description: Upstream owner/repo for the source tarball
        required: true
        type: string
  repository_dispatch:
    types: [bump-formula]

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve inputs
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_FORMULA: ${{ inputs.formula }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_REPOSITORY: ${{ inputs.repository }}
          PAYLOAD_FORMULA: ${{ github.event.client_payload.formula }}
          PAYLOAD_TAG: ${{ github.event.client_payload.tag }}
          PAYLOAD_REPOSITORY: ${{ github.event.client_payload.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            formula="$PAYLOAD_FORMULA"
            tag="$PAYLOAD_TAG"
            repository="$PAYLOAD_REPOSITORY"
          else
            formula="$INPUT_FORMULA"
            tag="$INPUT_TAG"
            repository="$INPUT_REPOSITORY"
          fi
          if [ -z "$formula" ] || [ -z "$tag" ] || [ -z "$repository" ]; then
            echo "formula, tag, and repository are required" >&2
            exit 1
          fi
          {
            echo "formula=$formula"
            echo "tag=$tag"
            echo "repository=$repository"
            echo "url=https://github.com/${repository}/archive/refs/tags/${tag}.tar.gz"
          } >> "$GITHUB_OUTPUT"

      - name: Download source tarball and compute sha256
        id: sha
        env:
          URL: ${{ steps.meta.outputs.url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            if curl -fsSL -o /tmp/source.tar.gz "$URL"; then
              break
            fi
            if [ "$attempt" -eq 36 ]; then
              echo "tarball not available after retries: $URL" >&2
              exit 1
            fi
            sleep 5
          done
          sha="$(sha256sum /tmp/source.tar.gz | awk '{print $1}')"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha"

      - name: Update formula
        id: bump
        env:
          FORMULA: ${{ steps.meta.outputs.formula }}
          TAG: ${{ steps.meta.outputs.tag }}
          REPOSITORY: ${{ steps.meta.outputs.repository }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
        run: |
          set -euo pipefail
          path="Formula/${FORMULA}.rb"
          result="$(python3 .github/scripts/bump_formula.py \
            "$path" \
            --repository "$REPOSITORY" \
            --tag "$TAG" \
            --sha256 "$SHA256")"
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.bump.outputs.result == 'changed'
        env:
          FORMULA: ${{ steps.meta.outputs.formula }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Formula/${FORMULA}.rb"
          git commit -m "Bump ${FORMULA} to ${TAG}"
          git pull --rebase origin HEAD
          git push
